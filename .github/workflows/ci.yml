name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: api_fiscal
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: api_fiscal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_fiscal -d api_fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://api_fiscal:integration_password@127.0.0.1:5432/api_fiscal_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-with-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
